<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login – Kestrel</title>
  <link rel="stylesheet" href="styles.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body class="auth-page">
<nav class="navbar">
  <div class="nav-inner">
    <div class="nav-logo"><i class="fa-solid fa-feather-pointed"></i> Kestrel</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Home</a>
      <a href="login.html" class="nav-link active">Login</a>
      <a href="signup.html" class="nav-link">Sign Up</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" onclick="setTheme(getTheme()==='dark'?'light':'dark')"><i class="fa-solid fa-moon"></i></button>
    </div>
  </div>
</nav>

<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div class="company-logo"><i class="fa-solid fa-feather-pointed"></i></div>
      <h1>Welcome back</h1>
      <p>Sign in to your Kestrel workspace</p>
    </div>
    
    <form id="loginForm" class="auth-form">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@company.com" required value="sarah@kestrel.com" class="modal-input"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="••••••••" required value="demo1234" class="modal-input"/>
      </div>
      <div class="form-options">
        <label class="checkbox">
          <input type="checkbox" id="remember"/>
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot-link">Forgot password?</a>
      </div>
      <button type="submit" class="btn-primary btn-full">Sign In</button>
    </form>
    
    <div class="auth-divider">
      <span>or</span>
    </div>
    
    <div class="auth-footer">
      <p>Don't have an account? <a href="signup.html">Create one</a></p>
      <p class="auth-note"><i class="fa-solid fa-circle-info"></i> Demo: Use any email/password to login as manager</p>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  applyTheme(getTheme());
  
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value.trim();
    
    if (!email || !password) {
      showToast('Please enter email and password', 'error');
      return;
    }
    
    // For demo: use pre-filled credentials
    const user = {
      email,
      name: 'Sarah Chen',
      role: 'manager',
      company: 'Kestrel Inc',
      createdAt: new Date().toISOString()
    };
    
    localStorage.setItem('kestrel_user', JSON.stringify(user));
    
    // Always reset bookings on login so fresh demo data loads
    localStorage.removeItem('kestrel_bookings');
    
    // Load default team if not exists
    if (!localStorage.getItem('kestrel_team')) {
      const defaultTeam = [
        { id: 'alex', name: 'Alex Morgan', role: 'Account Executive', avatar: 'AM', color: '#7c3aed', email: 'alex@kestrel.com' },
        { id: 'priya', name: 'Priya Nair', role: 'Customer Success', avatar: 'PN', color: '#0891b2', email: 'priya@kestrel.com' },
        { id: 'marcus', name: 'Marcus Trent', role: 'Solutions Engineer', avatar: 'MT', color: '#059669', email: 'marcus@kestrel.com' },
        { id: 'lucia', name: 'Lucia Ferreira', role: 'Account Manager', avatar: 'LF', color: '#d97706', email: 'lucia@kestrel.com' },
        { id: 'tom', name: 'Tom Ashby', role: 'Sales Development', avatar: 'TA', color: '#dc2626', email: 'tom@kestrel.com' }
      ];
      localStorage.setItem('kestrel_team', JSON.stringify(defaultTeam));
    }
    
    showToast('✓ Signed in successfully');
    setTimeout(() => {
      window.location.href = 'dashboard.html';
    }, 800);
  });
  
  function showToast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = `toast ${type}`;
    t.innerHTML = `<i class="fa-solid fa-circle-check"></i> ${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3500);
  }
});
</script>
</body>
</html>
